name: Android APK (development)

on:
  push:
    branches: [ main, 'development/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes Android command-line tools.
      # Avoid android-actions/setup-android: its default package list requests
      # the obsolete "tools" package and causes sdkmanager to fail.
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download ARM64 Libretro cores
        shell: bash
        run: |
          set -euo pipefail
          DEST="app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$DEST"
          BASE="https://buildbot.libretro.com/nightly/android/latest/arm64-v8a"
          CORES=(stella nestopia genesis_plus_gx gambatte mgba snes9x fbneo pcsx_rearmed mupen64plus_next_gles3 melonds flycast ppsspp yabasanshiro native32emu)
          for core in "${CORES[@]}"; do
            archive="/tmp/${core}.zip"
            curl --retry 3 --retry-delay 2 -fsSL "$BASE/${core}_libretro_android.so.zip" -o "$archive"
            mkdir -p "/tmp/core-${core}"
            unzip -o -q "$archive" -d "/tmp/core-${core}"
            binary="$(find "/tmp/core-${core}" -type f -name '*_libretro_android.so' -print -quit)"
            test -n "$binary"
            cp "$binary" "$DEST/"
          done
          ls -lh "$DEST"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle
        run: gradle --version

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: H8TV-Emulation-Center-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
